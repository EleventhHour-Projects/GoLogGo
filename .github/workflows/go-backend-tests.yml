name: Go backend tests

on:
  push:
    paths:
      - 'code/backend/**'
      - '.github/workflows/go-backend-tests.yml'
  pull_request:
    paths:
      - 'code/backend/**'
      - '.github/workflows/go-backend-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Backend unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./code/backend

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: code/backend/go.mod
          cache: true
          cache-dependency-path: code/backend/go.sum

      - name: Run Go test script
        run: ./scripts/test.sh
