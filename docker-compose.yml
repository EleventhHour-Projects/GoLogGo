services:
  backend:
    build:
      context: ./code/backend
      dockerfile: Dockerfile
    container_name: gologgo-backend
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml:
        condition: service_healthy
    env_file:
      - ./code/backend/.env
    ports:
      - "8080:8080"
    restart: unless-stopped

  ml:
    build:
      context: ./code/ml
      dockerfile: Dockerfile
    container_name: gologgo-ml
    env_file:
      - ./code/ml/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: gologgo-rabbitmq
    env_file:
      - ./code/backend/.env
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gologgo-redis
    env_file:
      - ./code/backend/.env
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  rabbitmq_data:
  redis_data:

